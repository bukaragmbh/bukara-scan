<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fertigungsplan Scan</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 40px 0;
    color: #202124;
    background: #f5f7f7;
  }
  .header {
    background: #00A597;
    padding: 24px 16px;
    text-align: center;
  }
  .header img {
    max-width: 220px;
    width: 60%;
    height: auto;
  }
  .content {
    padding: 24px 16px 0 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; color: #202124; }
  label { display: block; margin-top: 20px; font-weight: bold; font-size: 14px; }
  input[type=text], textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-top: 6px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  input[type=text]:focus, textarea:focus {
    outline: none;
    border-color: #00A597;
    box-shadow: 0 0 0 2px rgba(0,165,151,0.2);
  }
  .station-display {
    font-size: 20px;
    font-weight: bold;
    padding: 12px;
    background: #e0f5f2;
    color: #00A597;
    border-radius: 4px;
    margin-top: 6px;
  }
  button {
    margin-top: 28px;
    padding: 14px 28px;
    font-size: 16px;
    background: #00A597;
    color: white;
    border: none;
    border-radius: 4px;
    width: 100%;
    cursor: pointer;
    font-weight: bold;
  }
  button:active { background: #00867b; }
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 28px;
  }
  .action-buttons button {
    margin-top: 0;
    flex: 1;
  }
  .action-buttons .secondary-action {
    background: #ffffff;
    color: #00A597;
    border: 2px solid #00A597;
  }
  .action-buttons .secondary-action:active {
    background: #e0f5f2;
  }
  .planid-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .planid-row input[type=text] {
    margin-top: 0;
    flex: 1;
  }
  .scan-button {
    margin-top: 0;
    width: auto;
    white-space: nowrap;
    padding: 10px 14px;
    font-size: 14px;
    background: #2c3e40;
  }
  .scan-button:active { background: #1c2a2c; }
  #reader, #readerKunde {
    display: none;
    margin-top: 10px;
    border-radius: 4px;
    overflow: hidden;
    border: 2px solid #00A597;
    max-width: 160px;
    max-height: 160px;
    margin-left: auto;
    margin-right: auto;
  }
  #reader.active, #readerKunde.active { display: block; }
  #reader video, #readerKunde video,
  #reader img, #readerKunde img {
    width: 100% !important;
    height: 160px !important;
    object-fit: cover !important;
  }
  .scan-error {
    color: #d93025;
    font-size: 13px;
    margin-top: 6px;
  }
  .optional-hint {
    font-weight: normal;
    color: #888;
    font-size: 12px;
  }
  .scan-controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .control-button {
    margin-top: 0;
    width: auto;
    padding: 8px 14px;
    font-size: 14px;
    background: #2c3e40;
  }
  .control-button.active {
    background: #f9ab00;
  }
  .control-button:active { opacity: 0.85; }
  #zoomWrapper, #zoomWrapperKunde {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 160px;
  }
  .zoom-label {
    font-size: 13px;
    font-weight: bold;
    margin: 0;
    white-space: nowrap;
  }
  #zoomSlider {
    flex: 1;
  }
  .scan-debug {
    font-size: 11px;
    color: #888;
    margin-top: 8px;
    word-break: break-all;
    background: #f0f0f0;
    padding: 6px;
    border-radius: 4px;
    display: none;
  }
  .scan-debug.active { display: block; }
</style>
</head>

  <div class="content">
    <h1>Fertigungsplan Scan</h1>

    <form method="post" action="https://script.google.com/macros/s/AKfycbyTsM_ixxs920VLc1dIp8s7OHzHoZauy5-bfZ4J8aZfBnw948DLko0hTYKNdsv3cJGl/exec" id="scanForm">
      <label>Station</label>
      <div class="station-display" id="stationDisplay"></div>
      <input type="hidden" name="station" id="stationInput" value="">

      <label for="planId">Plan-ID *</label>
      <div class="planid-row">
        <input type="text" id="planId" name="planId" required autofocus>
        <button type="button" id="scanBtn" class="scan-button">📷 Scannen</button>
      </div>
      <div id="reader"></div>
      <div id="scanControls" class="scan-controls">
        <button type="button" id="torchBtn" class="control-button" style="display:none;">🔦 Blitz an</button>
        <div id="zoomWrapper" style="display:none;">
          <label class="zoom-label">🔍 Zoom</label>
          <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1">
        </div>
      </div>
      <div id="scanError" class="scan-error"></div>
      <div id="scanDebug" class="scan-debug"></div>

      <label for="kunde">Kunde <span class="optional-hint">(nur beim allerersten Scan, z.B. Wareneingang)</span></label>
      <div class="planid-row">
        <input type="text" id="kunde" name="kunde">
        <button type="button" id="scanKundeBtn" class="scan-button">📷 Scannen</button>
      </div>
      <div id="readerKunde"></div>
      <div id="scanControlsKunde" class="scan-controls">
        <button type="button" id="torchBtnKunde" class="control-button" style="display:none;">🔦 Blitz an</button>
        <div id="zoomWrapperKunde" style="display:none;">
          <label class="zoom-label">🔍 Zoom</label>
          <input type="range" id="zoomSliderKunde" min="1" max="5" step="0.1" value="1">
        </div>
      </div>
      <div id="scanErrorKunde" class="scan-error"></div>

      <label for="bemerkung">Bemerkung</label>
      <textarea id="bemerkung" name="bemerkung" rows="3"></textarea>

      <button type="submit">Erhalten</button>
    </form>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // Station aus der URL lesen (?station=Bernd) und anzeigen
    var params = new URLSearchParams(window.location.search);
    var station = params.get('station') || '';
    document.getElementById('stationDisplay').textContent = station;
    document.getElementById('stationInput').value = station;

    var html5QrCode = null;
    var scanning = false;

    function onScanSuccess(decodedText) {
      document.getElementById('planId').value = decodedText;
      stopScanner();
    }
    function onScanFailure(errorMessage) {
      // laufende Scan-Versuche ohne Treffer - ignorieren
    }
    function scanConfig() {
      return {
        fps: 10,
        qrbox: { width: 150, height: 80 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.CODABAR,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF
        ],
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      };
    }

    var torchOn = false;

    // Suffix ist '' für den Haupt-Scanner (Plan-ID) oder 'Kunde' für den Kunde-Scanner,
    // damit dieselbe Logik die jeweils passenden Steuerelemente anspricht.
    function controlsSuffixFor(readerDivId) {
      return readerDivId === 'readerKunde' ? 'Kunde' : '';
    }

    function setupPostStartControls(readerDivId) {
      var suffix = controlsSuffixFor(readerDivId);
      try {
        var caps = html5QrCode.getRunningTrackCapabilities();

        var torchBtn = document.getElementById('torchBtn' + suffix);
        if (caps && caps.torch) {
          torchBtn.style.display = 'inline-block';
          torchOn = false;
          torchBtn.textContent = '🔦 Blitz an';
          torchBtn.classList.remove('active');
        } else {
          torchBtn.style.display = 'none';
        }

        var zoomWrapper = document.getElementById('zoomWrapper' + suffix);
        var zoomSlider = document.getElementById('zoomSlider' + suffix);
        if (caps && caps.zoom && caps.zoom.max > caps.zoom.min) {
          zoomWrapper.style.display = 'flex';
          zoomSlider.min = caps.zoom.min;
          zoomSlider.max = caps.zoom.max;
          zoomSlider.step = caps.zoom.step || 0.1;
          zoomSlider.value = caps.zoom.min;
        } else {
          zoomWrapper.style.display = 'none';
        }
      } catch (e) {
        // Fähigkeiten nicht abfragbar - Steuerelemente einfach verborgen lassen
      }

      html5QrCode.applyVideoConstraints({
        advanced: [{ width: 1920, height: 1080 }]
      }).catch(function () {});
    }

    function attachTorchHandler(btnId) {
      document.getElementById(btnId).addEventListener('click', function () {
        torchOn = !torchOn;
        html5QrCode.applyVideoConstraints({
          advanced: [{ torch: torchOn }]
        }).then(function () {
          var btn = document.getElementById(btnId);
          btn.textContent = torchOn ? '🔦 Blitz aus' : '🔦 Blitz an';
          btn.classList.toggle('active', torchOn);
        }).catch(function () {
          torchOn = !torchOn; // zurücksetzen, falls fehlgeschlagen
        });
      });
    }
    function attachZoomHandler(sliderId) {
      document.getElementById(sliderId).addEventListener('input', function (e) {
        html5QrCode.applyVideoConstraints({
          advanced: [{ zoom: parseFloat(e.target.value) }]
        }).catch(function () {});
      });
    }

    attachTorchHandler('torchBtn');
    attachTorchHandler('torchBtnKunde');
    attachZoomHandler('zoomSlider');
    attachZoomHandler('zoomSliderKunde');

    function startScannerFor(targetInputId, readerDivId, errorDivId, btnId) {
      var readerDiv = document.getElementById(readerDivId);
      var errorDiv = document.getElementById(errorDivId);
      var btn = document.getElementById(btnId);
      errorDiv.textContent = '';

      if (scanning === readerDivId) {
        stopScanner();
        return;
      }
      if (scanning) {
        stopScanner();
      }

      readerDiv.classList.add('active');
      scanning = readerDivId;
      btn.textContent = '✕ Abbrechen';
      html5QrCode = new Html5Qrcode(readerDivId);
      activeReaderDivId = readerDivId;
      activeBtnId = btnId;

      var videoConstraints = { facingMode: 'environment' };

      html5QrCode.start(
        videoConstraints,
        scanConfig(),
        function (decodedText) {
          document.getElementById(targetInputId).value = decodedText;
          stopScanner();
        },
        onScanFailure
      ).then(function () {
        setupPostStartControls(readerDivId);
      }).catch(function (err) {
        var msg = (err && err.message) ? err.message : String(err);
        errorDiv.textContent = 'Kamera konnte nicht gestartet werden: ' + msg;
        scanning = false;
        btn.textContent = '📷 Scannen';
        readerDiv.classList.remove('active');
      });
    }

    var activeReaderDivId = null;
    var activeBtnId = null;

    document.getElementById('scanBtn').addEventListener('click', function () {
      startScannerFor('planId', 'reader', 'scanError', 'scanBtn');
    });

    document.getElementById('scanKundeBtn').addEventListener('click', function () {
      startScannerFor('kunde', 'readerKunde', 'scanErrorKunde', 'scanKundeBtn');
    });

    function stopScanner() {
      if (html5QrCode && scanning) {
        var readerDivId = activeReaderDivId;
        var btnId = activeBtnId;
        html5QrCode.stop().then(function () {
          document.getElementById(readerDivId).classList.remove('active');
          document.getElementById(btnId).textContent = '📷 Scannen';
          document.getElementById('torchBtn').style.display = 'none';
          document.getElementById('zoomWrapper').style.display = 'none';
          document.getElementById('torchBtnKunde').style.display = 'none';
          document.getElementById('zoomWrapperKunde').style.display = 'none';
          scanning = false;
        }).catch(function () {
          scanning = false;
        });
      } else {
        scanning = false;
      }
    }
  </script>
</body>
